name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result and which tool or package it affects.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Does this change installation or system integration?
      options:
        - No
        - Yes, package update behavior
        - Yes, autostart or Windows integration
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Suggested synthetic verification
      description: Explain how the behavior could be tested without installing software or changing the current computer.
